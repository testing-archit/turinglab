<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TuringLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0b0d12;--panel:#12151c;--panel2:#181c25;--border:#252a36;--text:#e6e8ee;--muted:#8a91a3;--accent:#7c9cff;--accent2:#5eead4;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--violet:#c084fc;--mono:'JetBrains Mono',ui-monospace,monospace}
[data-theme=light]{--bg:#f6f7fb;--panel:#fff;--panel2:#f0f2f7;--border:#dfe3ec;--text:#161a23;--muted:#5d6577;--accent:#3b5bdb;--accent2:#0f9488}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:17px;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);margin-bottom:2px;font-weight:500}
nav a:hover{background:var(--panel2);color:var(--text)}nav a.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
main{padding:22px 28px;min-width:0}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--muted);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g2,.g3,.g4{grid-template-columns:1fr}.app{grid-template-columns:1fr}aside{position:static;height:auto}}
.stat .v{font-size:26px;font-weight:700}.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--bad)}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:6px 8px;border-bottom:1px solid var(--border)}td.mono,.mono{font-family:var(--mono)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}tr.sel td{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;font-family:var(--mono)}
.b-ACCEPTED{background:#34d39922;color:var(--ok)}.b-REJECTED{background:#f8717122;color:var(--bad)}.b-RUNNING{background:#7c9cff22;color:var(--accent)}
.b-HALTED{background:#fbbf2422;color:var(--warn)}.b-LOOP_DETECTED{background:#c084fc22;color:var(--violet)}.b-STEP_LIMIT{background:#8a91a322;color:var(--muted)}
.tape-wrap{overflow-x:auto;padding:26px 4px 8px}
.tape{display:flex;gap:3px;justify-content:center;min-width:max-content;margin:auto}
.cell{width:40px;height:46px;border:1px solid var(--border);background:var(--panel2);border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 18px var(--mono);position:relative;transition:all .25s}
.cell.blank{color:var(--muted);opacity:.55}.cell .idx{position:absolute;bottom:-17px;font-size:9px;color:var(--muted);font-weight:400}
.cell.head{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel2));transform:translateY(-3px);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.cell.head::before{content:'▼';position:absolute;top:-22px;color:var(--accent);font-size:13px}
.cell.flash{animation:flash .5s}@keyframes flash{from{background:var(--accent2);color:#000}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
svg.graph{width:100%;height:380px;background:var(--bg);border:1px solid var(--border);border-radius:10px;user-select:none}
svg.graph text{fill:var(--text);font-family:var(--mono)}svg .node{cursor:grab}
.toast{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast div{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;max-width:420px;animation:in .2s}
.toast div.err{border-left-color:var(--bad)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty{color:var(--muted);text-align:center;padding:26px}
.errors{background:#f8717114;border:1px solid #f8717155;color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px}.errors li{margin:2px 0}
.okbox{background:#34d39914;border:1px solid #34d39955;color:var(--ok);border-radius:8px;padding:8px 12px;font-size:13px}
.modal-bg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;width:min(980px,94vw);max-height:90vh;overflow:auto}
.scroll{max-height:340px;overflow:auto}.muted{color:var(--muted)}.chip{font-family:var(--mono);background:var(--panel2);border:1px solid var(--border);padding:1px 7px;border-radius:6px;margin:2px;display:inline-block}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;display:flex}.bar span{display:block;height:100%}
.prose p,.prose li{color:var(--text);max-width:820px}.prose code{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px}
.rule{font:600 16px var(--mono);padding:10px;background:var(--panel2);border-radius:8px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">⟨◆⟩ <span>TuringLab</span></div>
    <nav id="nav">
      <a href="#/dashboard" data-r="dashboard">▦ Dashboard</a>
      <a href="#/designer" data-r="designer">✎ Machine Designer</a>
      <a href="#/simulator" data-r="simulator">▶ Simulator</a>
      <a href="#/library" data-r="library">❏ Machine Library</a>
      <a href="#/history" data-r="history">⟲ Execution History</a>
      <a href="#/analytics" data-r="analytics">▤ Analytics</a>
      <a href="#/learn" data-r="learn">✦ Learning Center</a>
    </nav>
    <div style="position:absolute;bottom:16px;left:12px;right:12px"><button id="themeBtn" style="width:100%;justify-content:center">◐ Toggle theme</button></div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
